<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інтерактивна карта — Попельнасте</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #map-error {
      display: none;
      position: fixed;
      inset: 12px;
      z-index: 20;
      background: #2b1111;
      color: #ffd6d6;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="map-error"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const errorBox = document.getElementById('map-error');
    function showErr(msg) {
      errorBox.style.display = 'block';
      errorBox.textContent = 'Помилка карти: ' + msg;
    }

    if (!window.maplibregl) {
      showErr('Не завантажився скрипт MapLibre GL JS.');
    } else {
      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [33.785, 48.618],
        zoom: 6
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      new maplibregl.Marker({ color: '#d4af37' })
        .setLngLat([33.785, 48.618])
        .setPopup(new maplibregl.Popup().setHTML('<strong>Попельнасте</strong>'))
        .addTo(map);

      map.on('error', (e) => {
        const detail = e && e.error ? (e.error.message || String(e.error)) : 'помилка завантаження стилю або тайлів';
        showErr(detail);
      });
    }
  </script>
</body>
</html>
