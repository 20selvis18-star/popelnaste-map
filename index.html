<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інтерактивна карта — Попельнасте</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .filter-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      max-width: calc(100% - 64px);
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover {
      background: rgba(212, 175, 55, 0.2);
    }
    .filter-btn.active {
      background: #d4af37;
      border-color: #d4af37;
      color: #0f172a;
      font-weight: 700;
    }
    .maplibregl-popup-content {
      background: #111827;
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      max-width: 270px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(212, 175, 55, 0.25);
    }
    .maplibregl-popup-close-button {
      color: #d4af37;
      font-size: 18px;
      padding: 4px 8px;
    }
    .maplibregl-popup-tip {
      border-top-color: #111827 !important;
      border-bottom-color: #111827 !important;
    }
    .popup-epoch {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #d4af37;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .popup-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .popup-desc {
      font-size: 13px;
      line-height: 1.45;
      color: #d1d5db;
      margin-bottom: 8px;
    }
    .popup-img {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
    #map-error {
      display: none;
      position: fixed;
      inset: 12px;
      z-index: 20;
      background: #2b1111;
      color: #ffd6d6;
      padding: 14px;
      border-radius: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="filter-bar" class="filter-bar">
    <button class="filter-btn active" data-epoch="all">Усі епохи</button>
  </div>

  <div id="map-error"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    // Хронологический порядок эпох для кнопок фильтра
    const EPOCH_ORDER = ["XVII ст.", "XVIII ст.", "XIX ст.", "XX ст.", "XXI ст."];

    // Список точек. Формат координат: [долгота, широта]
    const PLACES_DATA = [
      {
        title: "Попельнасте — історичний центр",
        epoch: "XIX ст.",
        color: "#d4af37",
        coordinates: [33.785, 48.618],
        description: "Історичний центр населеного пункту та ключові віхи розвитку громади.",
        image: ""
      },
      {
        title: "Степові шляхи козацької доби (1648)",
        epoch: "XVII ст.",
        color: "#c0392b",
        coordinates: [33.745, 48.635],
        description: "Контекст козацької доби та подій 1648 року у регіоні.",
        image: ""
      }
    ];

    const errorBox = document.getElementById("map-error");
    const filterBar = document.getElementById("filter-bar");

    function showErr(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = "Помилка карти: " + msg;
    }

    if (!window.maplibregl) {
      showErr("Не завантажився скрипт MapLibre GL JS.");
    } else {
      const map = new maplibregl.Map({
        container: "map",
        style: "https://demotiles.maplibre.org/style.json",
        center: [33.785, 48.618],
        zoom: 11
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      map.on("error", (e) => {
        const detail = e && e.error ? (e.error.message || String(e.error)) : "помилка завантаження стилю або тайлів";
        showErr(detail);
      });

      let markers = [];
      let activeEpoch = "all";

      function clearMarkers() {
        markers.forEach(m => m.remove());
        markers = [];
      }

      function buildPopupHtml(place) {
        const epochHtml = place.epoch ? `<div class="popup-epoch">${place.epoch}</div>` : "";
        const descHtml = place.description ? `<p class="popup-desc">${place.description}</p>` : "";
        const imgHtml = place.image
          ? `<img class="popup-img" src="${place.image}" alt="${place.title}" loading="lazy" />`
          : "";
        return `${epochHtml}<div class="popup-title">${place.title}</div>${descHtml}${imgHtml}`;
      }

      function renderMarkers(shouldFit = false) {
        clearMarkers();

        const filtered = PLACES_DATA.filter(item =>
          activeEpoch === "all" ? true : item.epoch === activeEpoch
        );

        const bounds = new maplibregl.LngLatBounds();

        filtered.forEach(place => {
          if (!Array.isArray(place.coordinates) || place.coordinates.length < 2) return;

          const popup = new maplibregl.Popup({ offset: 24 })
            .setHTML(buildPopupHtml(place));

          const marker = new maplibregl.Marker({ color: place.color || "#d4af37" })
            .setLngLat(place.coordinates)
            .setPopup(popup)
            .addTo(map);

          markers.push(marker);
          bounds.extend(place.coordinates);
        });

        if (shouldFit && filtered.length > 1) {
          map.fitBounds(bounds, { padding: 70, maxZoom: 13 });
        } else if (shouldFit && filtered.length === 1) {
          map.flyTo({ center: filtered[0].coordinates, zoom: 12 });
        }
      }

      function initFilters() {
        const foundEpochs = [];
        PLACES_DATA.forEach(item => {
          if (item.epoch && !foundEpochs.includes(item.epoch)) {
            foundEpochs.push(item.epoch);
          }
        });

        const sortedEpochs = [
          ...EPOCH_ORDER.filter(ep => foundEpochs.includes(ep)),
          ...foundEpochs.filter(ep => !EPOCH_ORDER.includes(ep))
        ];

        sortedEpochs.forEach(ep => {
          const btn = document.createElement("button");
          btn.className = "filter-btn";
          btn.textContent = ep;
          btn.dataset.epoch = ep;
          filterBar.appendChild(btn);
        });

        filterBar.addEventListener("click", (e) => {
          const btn = e.target.closest(".filter-btn");
          if (!btn) return;

          activeEpoch = btn.dataset.epoch;
          filterBar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          renderMarkers(true);
        });
      }

      map.on("load", () => {
        initFilters();
        renderMarkers(false);
      });
    }
  </script>
</body>
</html>
